  <script>
    /* apply saved language/theme before first paint (no flash) */
    (function () {
      try {
        var l = localStorage.getItem("lex_lang") === "en" ? "en" : "ar";
        var th = localStorage.getItem("lex_theme") === "dark" ? "dark" : "light";
        var h = document.documentElement;
        h.lang = l; h.dir = l === "ar" ? "rtl" : "ltr";
        h.setAttribute("data-theme", th); h.setAttribute("data-bs-theme", th);
      } catch (e) {}
    })();
  </script>
